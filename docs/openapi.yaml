openapi: 3.1.0
info:
  title: EMBODY API
  version: 1.0.0
  description: Safety-first commerce and workflow API. Clinical and pharmacy authorization remain external, credentialed responsibilities.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /products:
    get:
      summary: List published products
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, maximum: 48 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Paginated catalog }
  /auth/register:
    post:
      summary: Register an adult customer
      responses:
        '201': { description: Account created; email verification remains required }
        '422': { description: Validation error }
  /consultations:
    post:
      summary: Submit consented initial intake for professional review
      responses:
        '201': { description: Intake stored and safely classified }
        '403': { description: Age ineligible }
  /consultations/{id}/review:
    patch:
      summary: Record an authorized clinical disposition
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Review state updated }
        '403': { description: Required professional permission absent }
  /checkout:
    post:
      summary: Create an idempotent server-priced checkout
      description: Safe-disabled in this repository until approved payment, pharmacy, tax, and shipping services are configured.
      responses:
        '503': { description: Integration not configured }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: accessToken }
