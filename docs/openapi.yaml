openapi: 3.1.0
info:
  title: EMBODY Pharmacy API
  version: 1.2.0
  description: OTC commerce and pharmacy-readiness API. Prescription dispensing is disabled until verified configuration is supplied.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /auth/register:
    post:
      summary: Validate privacy-minimized onboarding answers, create a pending account, and send a Brevo email verification code
      responses:
        '202': { description: OTP challenge issued }
  /auth/login:
    post:
      summary: Validate password and send a login OTP
      responses:
        '202': { description: OTP challenge issued }
  /auth/verify-otp:
    post:
      summary: Consume an email verification, login, or password-reset OTP
      responses:
        '200': { description: Verification completed }
        '401': { description: Invalid code }
        '410': { description: Expired code }
  /auth/refresh:
    post:
      summary: Rotate the opaque refresh session
      responses:
        '200': { description: Session rotated }
  /products:
    get:
      summary: List published products
      responses:
        '200': { description: Paginated catalog }
  /media/signature:
    post:
      summary: Create an authorized Cloudinary upload signature
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Signed upload parameters }
        '403': { description: Permission or CSRF failure }
  /orders/{id}/invoice/email:
    post:
      summary: Generate a PDF invoice and send it to the verified account email through Brevo
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Invoice sent }
  /pharmacy/readiness:
    get:
      summary: Return non-sensitive pharmacy configuration readiness
      responses:
        '200': { description: Readiness status }
  /chat:
    get:
      summary: Return the authenticated customer's support conversation and latest 100 messages
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Customer conversation }
        '401': { description: Authentication required }
  /chat/messages:
    post:
      summary: Send an idempotent customer message and notify the support mailbox through Brevo
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Message accepted }
        '403': { description: Customer role or CSRF check failed }
        '429': { description: Message rate limit reached }
  /admin/chat:
    get:
      summary: List customer conversations with identity and unread state for authorized staff
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Paginated support inbox }
        '403': { description: Support permission required }
  /admin/chat/{id}/messages:
    post:
      summary: Send an audited human support reply
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Reply sent }
        '403': { description: Chat write permission or CSRF check failed }
  /checkout:
    post:
      summary: Create a server-priced checkout
      description: Safe-disabled until payment, pharmacy, tax, and shipping services are approved and configured.
      responses:
        '503': { description: Integration not configured }
components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: accessToken }
